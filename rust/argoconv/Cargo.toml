[package]
name = "argoconv"
version = "0.1.0"
edition = "2021"

# 애플TV 앱에 정적 링크할 라이브러리다. cdylib 이 아니라 staticlib —
# tvOS 는 서드파티 동적 라이브러리를 싫어한다.
[lib]
name = "argoconv"
crate-type = ["staticlib"]

[dependencies]
minipdf = "0.7"

[profile.release]
opt-level = "z"     # 크기 우선. 변환은 이미 0.1 초 안쪽이라 속도를 더 살 이유가 없다.
lto = true
codegen-units = 1
panic = "abort"
strip = true
