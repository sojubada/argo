[package]
name = "argoconv"
version = "0.1.0"
edition = "2021"

# 애플TV 앱에 정적 링크할 라이브러리다. cdylib 이 아니라 staticlib —
# tvOS 는 서드파티 동적 라이브러리를 싫어한다.
[lib]
name = "argoconv"
crate-type = ["staticlib", "rlib"]

[dependencies]
# 벤더링한 사본을 쓴다. 슬라이드 제목이 사라지던 문제를 고쳤다.
minipdf = { path = "../vendor/minipdf" }
# 한글 문서: hwp·hwpx 를 읽어 쪽마다 SVG 로 그린다.
hwpers = { path = "../vendor/hwpers" }
# 새 한글 엔진(MIT). 먼저 이것으로 그려 보고, 못 열면 hwpers 로 넘어간다.
# 문제가 생기면 --no-default-features 로 빼고 지을 수 있다.
rhwp = { path = "../vendor/rhwp", default-features = false, optional = true }
# 그 SVG 를 PDF 로 옮긴다. 둘 다 순수 Rust 라 tvOS 로 간다.
svg2pdf = "0.13"
pdf-writer = "0.12"
# 글꼴 파일의 이름표를 읽는다 (폰트 폴더 색인).
ttf-parser = "0.25"
# 문서 안 XML 에서 글꼴 이름을 훑는다. minipdf 와 같은 판을 쓴다.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# 발표 문서를 SVG 로 그리는 데 쓴다 (usvg 와 같은 판).
roxmltree = "0.20"
# 발표 문서 안의 BMP·TIFF 그림을 PNG 로.
image = { version = "0.25", default-features = false, features = ["png", "bmp", "tiff"] }

[features]
default = ["rhwp"]

[profile.release]
opt-level = "z"     # 크기 우선. 변환은 이미 0.1 초 안쪽이라 속도를 더 살 이유가 없다.
lto = true
codegen-units = 1
# panic = "abort" 를 쓰지 않는다. 변환기가 패닉하면 앱이 통째로 죽었다 —
# 낯선 문서 하나가 파일 탐색기를 끌고 가서는 안 된다.
strip = true
