    "src/**/*",
    "Cargo.toml",
    "README.md",
    "LICENSE-*",
]
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "A Rust library for parsing Korean Hangul Word Processor (HWP) files with full layout rendering support"
homepage = "https://github.com/Indosaram/hwpers"
documentation = "https://docs.rs/hwpers"
readme = "README.md"
keywords = [
    "hwp",
    "parser",
    "hangul",
    "document",
    "korean",
]
categories = [
    "parser-implementations",
    "text-processing",
    "rendering",
]
license = "MIT OR Apache-2.0"
