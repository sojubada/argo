name: tvOS SDK inventory

# What does the tvOS SDK actually ship? Apple's documentation says PDFKit
# is available on tvOS 11+. It is not in the SDK, and finding that out
# cost a rewrite. This workflow answers the question from the SDK itself
# so it never has to be guessed again.
#
# Run it from the Actions tab. The answer lands in the run's artifact.

on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Optional: only show entries matching this (e.g. PDF, Web, Office)"
        type: string
        required: false
      symbols:
        description: "Optional: comma-separated API names to look for in the SDK headers (e.g. UIKeyCommand,pressesBegan)"
        type: string
        required: false

jobs:
  inventory:
    runs-on: macos-14
    steps:
      - name: Select Xcode 15
        run: |
          for candidate in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app; do
            if [ -d "$candidate" ]; then sudo xcode-select -s "$candidate"; break; fi
          done
          xcodebuild -version

      - name: List what the SDK ships
        run: |
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          echo "SDK: $SDK"
          echo "Version: $(xcrun --sdk appletvos --show-sdk-version)"
          mkdir -p out

          echo "=== Public frameworks ===" | tee out/inventory.txt
          ls "$SDK/System/Library/Frameworks" | sed 's/\.framework$//' | sort | tee -a out/inventory.txt

          echo "" | tee -a out/inventory.txt
          echo "=== Private frameworks ===" | tee -a out/inventory.txt
          ls "$SDK/System/Library/PrivateFrameworks" 2>/dev/null | sed 's/\.framework$//' | sort | tee -a out/inventory.txt

          echo "" | tee -a out/inventory.txt
          echo "=== Swift modules ===" | tee -a out/inventory.txt
          ls "$SDK/usr/lib/swift" 2>/dev/null | sort | tee -a out/inventory.txt

          echo "" | tee -a out/inventory.txt
          echo "=== Shipped dylibs ===" | tee -a out/inventory.txt
          ls "$SDK/usr/lib" 2>/dev/null | sort | tee -a out/inventory.txt

          if [ -n "${{ inputs.grep }}" ]; then
            echo ""
            echo "=== Matching '${{ inputs.grep }}' ==="
            grep -i "${{ inputs.grep }}" out/inventory.txt || echo "(no match — it is not in the SDK)"
          fi

          echo ""
          echo "=== Quick answers ==="
          for f in PDFKit WebKit QuickLook CoreText CoreGraphics SafariServices \
                   UIKit AVFoundation Compression libarchive libxml2 libz; do
            if ls "$SDK/System/Library/Frameworks" | grep -qi "^${f}\.framework$" \
               || ls "$SDK/usr/lib" 2>/dev/null | grep -qi "^${f}\."; then
              echo "  $f: PRESENT"
            else
              echo "  $f: ABSENT"
            fi
          done

      - name: Look for specific APIs in the headers
        if: inputs.symbols != ''
        run: |
          SDK=$(xcrun --sdk appletvos --show-sdk-path)
          echo "=== Looking for each name in the SDK's own headers ==="
          echo ""
          echo "Three verdicts, and the difference between them has already cost"
          echo "one rewrite and one broken build:"
          echo ""
          echo "  USABLE      declared, and not marked unavailable for tvOS."
          echo "  BLOCKED     declared, but marked API_UNAVAILABLE(tvos) or"
          echo "              __TVOS_PROHIBITED. The compiler refuses it. The class"
          echo "              may still exist in the shipped binary, reachable"
          echo "              through the Objective-C runtime -- that is a separate"
          echo "              question and only a device probe answers it."
          echo "  ABSENT      not in the SDK at all."
          echo ""
          IFS=',' read -ra NAMES <<< "${{ inputs.symbols }}"
          for raw in "${NAMES[@]}"; do
            name=$(echo "$raw" | xargs)
            [ -z "$name" ] && continue
            hits=$(grep -rl --include='*.h' --include='*.swiftinterface' \
                     -w "$name" \
                     "$SDK/System/Library/Frameworks" "$SDK/usr/lib/swift" 2>/dev/null | head -4 || true)
            if [ -z "$hits" ]; then
              echo "ABSENT   $name"
              echo ""
              continue
            fi

            # Read the declaring line and the few around it: the availability
            # attribute usually sits on the same line or just above.
            blocked=""
            for f in $hits; do
              ctx=$(grep -n -w "$name" "$f" 2>/dev/null | head -3 | cut -d: -f1 | while read -r ln; do
                      start=$((ln > 3 ? ln - 3 : 1))
                      sed -n "${start},$((ln + 1))p" "$f"
                    done)
              if echo "$ctx" | grep -qE 'API_UNAVAILABLE\([^)]*tvos|__TVOS_PROHIBITED|@available\([^)]*tvOS[^)]*unavailable'; then
                blocked="$f"
                break
              fi
            done

            if [ -n "$blocked" ]; then
              echo "BLOCKED  $name"
              echo "  marked unavailable for tvOS in:"
              echo "  $blocked" | sed "s|$SDK|  |"
              echo "  -> the compiler will refuse it. Only a device probe through"
              echo "     the ObjC runtime can say whether it exists anyway."
            else
              echo "USABLE   $name"
              echo "$hits" | sed "s|$SDK|  |"
            fi
            echo ""
          done

      - uses: actions/upload-artifact@v4
        with:
          name: tvos-sdk-inventory
          path: out/inventory.txt
