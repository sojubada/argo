name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a GitHub release with the IPA"
        type: boolean
        default: true
      release_note:
        description: "One line describing what this build is for"
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    # macos-14 는 2026-11-02 에 폐기된다(그 전에 중단 기간이 있다). macos-15 + Xcode 16.
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          for candidate in /Applications/Xcode_16.4.app /Applications/Xcode_16.3.app /Applications/Xcode_16.2.app /Applications/Xcode_16.1.app /Applications/Xcode_16.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i appletv || true

      - name: Patch the tvOS SDK's spawn.h
        # Spartan calls posix_spawnattr_set_persona_np(), which Apple's shipped
        # spawn.h does not declare. Upstream tells you to do this by hand.
        run: |
          SDK_PATH="$(xcrun --sdk appletvos --show-sdk-path)"
          echo "tvOS SDK: $SDK_PATH"
          sudo cp "$SDK_PATH/usr/include/spawn.h" "$SDK_PATH/usr/include/spawn.h.orig" || true
          sudo cp spawn.h "$SDK_PATH/usr/include/spawn.h"

      - name: Rust 로 변환기 빌드
        run: |
          # 오피스 문서를 기기 안에서 PDF 로 바꾸는 라이브러리다.
          # aarch64-apple-tvos 는 Tier 3 라 표준 라이브러리가 미리 빌드되어
          # 있지 않다 — nightly 로 std 까지 같이 짓는다.
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          export SDKROOT=$(xcrun --sdk appletvos --show-sdk-path)
          export TVOS_DEPLOYMENT_TARGET=16.0
          cd rust/argoconv
          cargo +nightly build --release \
            -Z build-std=std,panic_unwind \
            --target aarch64-apple-tvos
          mkdir -p "$GITHUB_WORKSPACE/rust/lib"
          cp target/aarch64-apple-tvos/release/libargoconv.a \
             "$GITHUB_WORKSPACE/rust/lib/"
          ls -lh "$GITHUB_WORKSPACE/rust/lib/"

      - name: Install ldid
        run: |
          brew install ldid || brew install ldid-procursus
          ldid -v || true

      # 두 판을 같은 코드에서 낸다. 안전판은 ARGO_SAFE 를 켜서 짓는다 —
      # 안전 모드가 늘 켜져 있고, 잠긴 항목이 든 폴더는 지우거나 옮기지 못한다.
      # 모험가판은 지금까지와 같다(안전 모드를 끌 수 있다).
      - name: Build Adventurer edition (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Spartan.xcodeproj \
            -scheme Spartan \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Package Adventurer edition
        run: |
          set -e
          bash tools/package_ipa.sh "Argo-Adventurer.ipa" "Argo" "${{ github.run_number }}"

      - name: Build Safe edition (unsigned)
        run: |
          set -o pipefail
          # 앞 판의 앱을 치운다. 이 프로젝트는 앱을 소스 옆에 설치하므로
          # 남겨 두면 포장 단계가 옛 앱을 집을 수 있다.
          find build/Build/Products Applications . -maxdepth 4 -name 'Argo.app' -type d -prune -exec rm -rf {} + 2>/dev/null || true
          xcodebuild \
            -project Spartan.xcodeproj \
            -scheme Spartan \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            'SWIFT_ACTIVE_COMPILATION_CONDITIONS=$(inherited) ARGO_SAFE' \
            build

      - name: Package Safe edition
        run: |
          set -e
          bash tools/package_ipa.sh "Argo-Safe.ipa" "Argo Safe" "${{ github.run_number }}"
          echo "BUILD_TAG=build-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
          ls -lh Argo-*.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Argo-ipa
          path: Argo-*.ipa

      # Releases are cut by hand, from the Actions tab, when a build is actually
      # going onto the Apple TV. A push only proves the code compiles and leaves
      # the IPA as a run artifact.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: Argo ${{ env.IPA_VERSION }} build ${{ github.run_number }} (${{ env.SHORT_SHA }})
          body: |
            ${{ inputs.release_note }}

            Unsigned, fakesigned build of Argo - a tvOS file browser.
            Install with TrollStore on your Apple TV.

            - Argo-Safe.ipa: 안전판 — 안전 모드 항상 켜짐, 잠긴 항목이 든 폴더는 지우기 불가
            - Argo-Adventurer.ipa: 모험가판 — 안전 모드를 끌 수 있음
            (두 판은 같은 앱이라 하나만 설치됩니다)

            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}

            Test checklist: docs/TEST_CHECKLIST.md
          files: |
            Argo-Safe.ipa
            Argo-Adventurer.ipa
