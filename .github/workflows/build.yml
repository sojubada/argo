name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      make_release:
        description: "Publish a GitHub release with the IPA"
        type: boolean
        default: true
      release_note:
        description: "One line describing what this build is for"
        type: string
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 15
        run: |
          for candidate in /Applications/Xcode_15.4.app /Applications/Xcode_15.3.app /Applications/Xcode_15.2.app; do
            if [ -d "$candidate" ]; then
              sudo xcode-select -s "$candidate"
              break
            fi
          done
          xcodebuild -version
          xcodebuild -showsdks | grep -i appletv || true

      - name: Patch the tvOS SDK's spawn.h
        # Spartan calls posix_spawnattr_set_persona_np(), which Apple's shipped
        # spawn.h does not declare. Upstream tells you to do this by hand.
        run: |
          SDK_PATH="$(xcrun --sdk appletvos --show-sdk-path)"
          echo "tvOS SDK: $SDK_PATH"
          sudo cp "$SDK_PATH/usr/include/spawn.h" "$SDK_PATH/usr/include/spawn.h.orig" || true
          sudo cp spawn.h "$SDK_PATH/usr/include/spawn.h"

      - name: Rust 로 변환기 빌드
        run: |
          # 오피스 문서를 기기 안에서 PDF 로 바꾸는 라이브러리다.
          # aarch64-apple-tvos 는 Tier 3 라 표준 라이브러리가 미리 빌드되어
          # 있지 않다 — nightly 로 std 까지 같이 짓는다.
          rustup toolchain install nightly --profile minimal
          rustup component add rust-src --toolchain nightly
          export SDKROOT=$(xcrun --sdk appletvos --show-sdk-path)
          export TVOS_DEPLOYMENT_TARGET=16.0
          cd rust/argoconv
          cargo +nightly build --release \
            -Z build-std=std,panic_abort \
            --target aarch64-apple-tvos
          mkdir -p "$GITHUB_WORKSPACE/rust/lib"
          cp target/aarch64-apple-tvos/release/libargoconv.a \
             "$GITHUB_WORKSPACE/rust/lib/"
          ls -lh "$GITHUB_WORKSPACE/rust/lib/"

      - name: Install ldid
        run: |
          brew install ldid || brew install ldid-procursus
          ldid -v || true

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Spartan.xcodeproj \
            -scheme Spartan \
            -configuration Release \
            -destination 'generic/platform=tvOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ENABLE_BITCODE=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Fakesign and package
        run: |
          set -e
          # DEPLOYMENT_LOCATION=YES in this project installs the app next to the
          # sources rather than into DerivedData, so look in both places.
          APP_PATH="$(find build/Build/Products Applications . -maxdepth 4 -name 'Argo.app' -type d 2>/dev/null | head -n 1)"
          if [ -z "$APP_PATH" ]; then
            echo "Could not find Argo.app"
            find . -maxdepth 5 -name '*.app' -type d -print
            exit 1
          fi
          echo "App: $APP_PATH"

          # Apply the entitlements the app needs under TrollStore / a jailbreak.
          ldid -S"$GITHUB_WORKSPACE/Argo.entitlements" "$APP_PATH/Argo"

          # Fakesign anything else that ships inside the bundle.
          find "$APP_PATH" -type f \( -name '*.dylib' -o -name 'RootHelper' \) -print0 \
            | xargs -0 -I{} ldid -S "{}" || true

          # Stamp the run number so an installed build is identifiable on the
          # device. CFBundleShortVersionString stays 1.0; this is the build
          # counter beside it.
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" \
            "$APP_PATH/Info.plist" 2>/dev/null \
            || /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string ${{ github.run_number }}" \
                 "$APP_PATH/Info.plist"

          rm -rf Payload Argo.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qry Argo.ipa Payload
          ls -lh Argo.ipa

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist" 2>/dev/null || echo 1.0)"
          echo "IPA_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "BUILD_TAG=build-$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_ENV"
          echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Argo-ipa
          path: Argo.ipa

      # Releases are cut by hand, from the Actions tab, when a build is actually
      # going onto the Apple TV. A push only proves the code compiles and leaves
      # the IPA as a run artifact.
      - name: Publish release
        if: github.event_name == 'workflow_dispatch' && inputs.make_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.BUILD_TAG }}
          name: Argo ${{ env.IPA_VERSION }} build ${{ github.run_number }} (${{ env.SHORT_SHA }})
          body: |
            ${{ inputs.release_note }}

            Unsigned, fakesigned build of Argo - a tvOS file browser.
            Install with TrollStore on your Apple TV.

            - Build: ${{ github.run_number }}
            - Commit: ${{ github.sha }}

            Test checklist: docs/TEST_CHECKLIST.md
          files: Argo.ipa
